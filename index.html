<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AYAZ GROUP | Güneş Enerjisi ve GES Çözümleri</title>
<meta name="description" content="AYAZ GROUP, Bursa ve çevresinde güneş enerjisi sistemleri, GES projeleri ve enerji depolama çözümleri sunar.">
<meta name="theme-color" content="#16466a">

<style>
:root{
 --blue:#16466a;
 --green:#269b73;
 --light:#f2f7fa;
 --text:#18364c;
 --muted:#607789;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;font-family:Arial, sans-serif;color:var(--text);background:var(--light);line-height:1.65}
a{text-decoration:none;color:inherit}
header{position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 3px 18px #17334b12}
.nav{max-width:1150px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:25px;font-weight:900;letter-spacing:1px;color:var(--blue)}
.logo span{color:var(--green)}
nav{display:flex;gap:20px;font-size:14px;font-weight:bold}
nav a:hover{color:var(--green)}
.menu{display:none;background:var(--blue);color:white;border:0;border-radius:8px;padding:8px 12px;font-size:21px}

/* HERO BÖLÜMÜ VE GÜNEŞ PANELSİ ARKA PLANI */
.hero{
 min-height:680px;
 position:relative;
 display:flex;
 align-items:center;
 overflow:hidden;
 background:#093049;
 color:white;
}
.hero-photo{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:cover;
 object-position:center;
 opacity:0.85;
}
.hero::after{
 content:"";
 position:absolute;
 inset:0;
 background:linear-gradient(90deg, rgba(9,48,73,0.92) 0%, rgba(9,48,73,0.65) 50%, rgba(9,48,73,0.3) 100%);
}
.hero-content{
 position:relative;
 z-index:2;
 width:100%;
 max-width:1150px;
 margin:auto;
 padding:90px 24px;
}
.eyebrow{font-size:13px;letter-spacing:3px;font-weight:bold;color:#c9f5df;text-shadow:0 1px 3px rgba(0,0,0,0.5)}
h1{font-size:clamp(42px,7vw,76px);line-height:1.08;margin:18px 0;max-width:750px;text-shadow:0 2px 10px rgba(0,0,0,0.4)}
h1 span{color:#baf0d5}
.hero p{font-size:19px;max-width:620px;color:#e2f1f8;text-shadow:0 1px 3px rgba(0,0,0,0.5)}
.actions{display:flex;gap:13px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-block;border:0;border-radius:8px;padding:13px 21px;font-weight:bold;
